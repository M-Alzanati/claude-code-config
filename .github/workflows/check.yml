name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # The installer targets several distros; prove the config validates on a
    # stock runner, not just the machine it was authored on.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: command -v jq || (sudo apt-get update && sudo apt-get install -y jq)
        if: runner.os == 'Linux'

      - name: Validate config
        # check.sh resolves its own root from CLAUDE_CONFIG_DIR, so it runs
        # against the checkout instead of a real ~/.claude.
        env:
          CLAUDE_CONFIG_DIR: ${{ github.workspace }}
        run: ./check.sh

      - name: Installer dry-run
        env:
          CLAUDE_CONFIG_DIR: ${{ github.workspace }}
        run: sh install.sh --dry-run --no-deps
